<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Not Found</title>
<style>
  body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:#fff;color:#202124;padding:40px 24px}
  .wrap{max-width:560px;margin:8vh auto 0}
  .logo{font-size:28px;font-weight:600;letter-spacing:-1px;margin-bottom:28px}
  h1{font-size:22px;margin:0 0 14px}
  b{font-size:18px}
  p{font-size:15px;line-height:1.6;color:#5f6368}
  .code{color:#9aa0a6;font-size:13px;margin-top:24px}
</style></head><body>
<div class="wrap">
  <div class="logo">Google</div>
  <h1><b>404.</b> 오류입니다.</h1>
  <p>요청한 URL을 이 서버에서 찾을 수 없습니다. 찾을 수 있는 정보가 이게 전부입니다.</p>
  <div class="code" id="u"></div>
  <p><a href="index.html">← 돌아가기</a></p>
</div>
<script>document.getElementById('u').textContent = '요청한 주소: /search?q=' + (new URLSearchParams(location.search).get('q')||'');</script>
</body></html>
